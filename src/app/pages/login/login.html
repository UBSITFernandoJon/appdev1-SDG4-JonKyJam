<!-- Loading state -->
<div *ngIf="isLoading" class="text-center text-muted py-3">
  Loading books...
</div>

<!-- Carousel -->
<div *ngIf="!isLoading" class="d-flex align-items-center justify-content-center gap-3">

  <!-- Left Arrow -->
  <button
    class="btn btn-outline-success rounded-circle d-flex align-items-center justify-content-center"
    style="width:42px; height:42px; font-size:20px; flex-shrink:0;"
    (click)="prev()"
    [disabled]="current === 0">
    &#8249;
  </button>

  <!-- Book Boxes -->
  <div class="d-flex align-items-center gap-3 overflow-hidden">
    <div
      *ngFor="let book of books; let i = index"
      class="rounded-3 overflow-hidden d-flex flex-column align-items-center justify-content-end"
      [ngClass]="{
        'shadow border-0': getClass(i) === 'active',
        'border opacity-75':  getClass(i) === 'adjacent',
        'border opacity-40':  getClass(i) === 'far'
      }"
      [ngStyle]="{
        width:      getSize(i) + 'px',
        height:     getSize(i) * 1.5 + 'px',
        cursor:     'pointer',
        transition: 'all 0.3s cubic-bezier(0.34,1.2,0.64,1)',
        backgroundImage: 'url(' + getCover(book) + ')',
        backgroundSize: 'cover',
        backgroundPosition: 'center'
      }"
      (click)="setCurrent(i)">

      <!-- Title tooltip on active -->
      <div
        *ngIf="getClass(i) === 'active'"
        class="w-100 text-white text-center px-1 py-1"
        style="background: rgba(0,0,0,0.55); font-size:10px; line-height:1.2;">
        {{ book.title | slice:0:40 }}{{ book.title.length > 40 ? '...' : '' }}
      </div>

    </div>
  </div>

  <!-- Right Arrow -->
  <button
    class="btn btn-outline-success rounded-circle d-flex align-items-center justify-content-center"
    style="width:42px; height:42px; font-size:20px; flex-shrink:0;"
    (click)="next()"
    [disabled]="current === books.length - 1">
    &#8250;
  </button>

</div>
