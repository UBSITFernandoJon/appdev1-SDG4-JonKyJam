<section class="text-center py-5">
  <h1 class="display-4 fw-bold text-success">JonKyJam</h1>
  <p class="lead">SDG 4: Quality Education</p>
  
  <img src="assets/Images/Screenshot_2026-04-29_121407-removebg-preview.png" alt="Logo" class="img-fluid my-3" style="max-height: 250px;">
  
  <p class="text-muted">
    Today: {{ today | date:'fullDate' }}
  </p>

  <p class="text-uppercase text-success fw-bold">
    {{ tagline | uppercase }}
  </p>

  <div *ngIf="returnUrl" class="alert alert-warning mt-4 mx-auto" style="max-width: 500px;">
    🔒 You need to log in to access <strong>{{ returnUrl }}</strong>.
  </div>

  <div class="mt-3 d-flex justify-content-center align-items-center">
    <a routerLink="/dashboard" class="btn btn-success btn-lg me-3">
      Browse Resources
    </a>

    <ul class="navbar-nav list-unstyled d-inline-flex flex-row">
      <li class="nav-item ms-2" *ngIf="!isLoggedIn()">
        <a class="btn btn-light btn-lg fw-bold border" routerLink="/login">
          🔑 Log In
        </a>
      </li>

      <li class="nav-item ms-2" *ngIf="isLoggedIn()">
        <button class="btn btn-outline-danger btn-lg fw-bold" (click)="logout()">
          🚪 Log Out
        </button>
      </li>
    </ul>
  </div>
</section>
